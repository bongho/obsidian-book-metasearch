version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      # `@vitest/coverage-v8` peer-depends on the exact vitest version, so the
      # two only install together. Split across separate PRs each side fails
      # npm ci with ERESOLVE — which is what happened to #16/#18 when vitest
      # 3 -> 4 fell outside the minor/patch group. Majors are grouped here.
      #
      # Listing this group first does NOT make it win: Dependabot assigns a
      # dependency by group *specificity*, not by declaration order, and it
      # scores `dependency-type` above `patterns`. So `@vitest/coverage-v8`
      # went to dev-dependencies anyway and #22 shipped vitest alone —
      # exactly the ERESOLVE split this group exists to prevent. The
      # `exclude-patterns` below is what actually keeps the pair together.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
